name: Validar PR

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: gym-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pruebas de ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Construir imagen de pruebas
        run: docker build --target test --tag gym-pr-test ./${{ matrix.component }}
      - name: Ejecutar pruebas sin red ni credenciales de producción
        run: >-
          docker run --rm --network none
          --env AUTH_SECRET_KEY=ci-only-test-key-not-for-production-0123456789abcdef
          gym-pr-test
      - name: Compilar frontend de producción
        if: matrix.component == 'frontend'
        run: docker build --tag gym-pr-frontend ./frontend

  schedule-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/schedule-emails/index.ts
      - run: deno test supabase/tests/

  postgres:
    name: Contratos y concurrencia en PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTH_SECRET_KEY: ci-only-test-key-not-for-production-0123456789abcdef
      GYM_TEST_POSTGRES_CONTAINER: gym-pr-postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - name: Preparar PostgreSQL aislado con datos sintéticos
        run: |
          docker run --rm --detach --name gym-pr-postgres --network none \
            --env POSTGRES_PASSWORD=ci-local-tests-only --env POSTGRES_DB=gym_test postgres:16-alpine
          for attempt in $(seq 1 30); do
            if docker exec gym-pr-postgres pg_isready -U postgres -d gym_test; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: python -m pytest backend/tests/test_atomic_transactions_postgres.py backend/tests/test_public_preregistrations_postgres.py -q
      - name: Limpiar PostgreSQL
        if: always()
        run: docker rm --force gym-pr-postgres
