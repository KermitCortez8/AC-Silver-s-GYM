name: Validar PR

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: gym-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pruebas de ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ejecutar pruebas y conservar JUnit
        uses: ./.github/actions/test-with-report
        with:
          component: ${{ matrix.component }}
      - name: Compilar frontend de producción
        if: matrix.component == 'frontend'
        run: docker build --tag gym-pr-frontend ./frontend

  schedule-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/schedule-emails/index.ts
      - name: Probar recordatorios y generar JUnit
        run: |
          mkdir -p "$RUNNER_TEMP/gym-reports"
          deno test --junit-path="$RUNNER_TEMP/gym-reports/schedule-emails.xml" supabase/tests/
      - name: Conservar resultados de recordatorios
        if: always()
        uses: ./.github/actions/upload-junit
        with:
          component: schedule-emails
          report: ${{ runner.temp }}/gym-reports/schedule-emails.xml

  postgres:
    name: Contratos y concurrencia en PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTH_SECRET_KEY: ci-only-test-key-not-for-production-0123456789abcdef
      GYM_TEST_POSTGRES_CONTAINER: gym-pr-postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - name: Preparar PostgreSQL aislado con datos sintéticos
        run: |
          docker run --rm --detach --name gym-pr-postgres --network none \
            --env POSTGRES_PASSWORD=ci-local-tests-only --env POSTGRES_DB=gym_test postgres:16-alpine
          for attempt in $(seq 1 30); do
            if docker exec gym-pr-postgres pg_isready -U postgres -d gym_test; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verificar transacciones, preregistros, asistencia y sesiones
        run: >-
          python -m pytest
          backend/tests/transversales/postgres/test_atomic_transactions_postgres.py
          backend/tests/clientes/postgres/test_public_preregistrations_postgres.py
          backend/tests/asistencias/postgres/test_attendance_deadline_postgres.py
          backend/tests/asistencias/postgres/test_automatic_attendance_postgres.py
          backend/tests/horarios_matriculas/postgres/test_schedule_sessions_postgres.py
          backend/tests/asistencias/postgres/test_attendance_enrollment_flow_postgres.py
          backend/tests/clientes/postgres/test_client_deletion_postgres.py
          backend/tests/notificaciones/postgres/test_membership_renewal_postgres.py
          --junitxml=${{ runner.temp }}/gym-reports/postgres.xml
          -q
      - name: Conservar resultados de PostgreSQL
        if: always()
        uses: ./.github/actions/upload-junit
        with:
          component: postgres
          report: ${{ runner.temp }}/gym-reports/postgres.xml
      - name: Limpiar PostgreSQL
        if: always()
        run: docker rm --force gym-pr-postgres
