name: CI/CD Pipeline GYM

# Un único evento por merge, incluidos squash y rebase. Cerrar sin fusionar
# no ejecuta los jobs. No se repiten las pruebas por push, tags o PR abiertos.
on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  actions: read

# Cada PR conserva su ejecución; otro merge no cancela su despliegue.
concurrency:
  group: gym-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  documentation:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar contexto, contratos e integración oficial aislada
        run: |
          python .specify/.codex/hooks/validate.py
          python -B -m unittest discover -s .specify/tests -v

  docker-ci:
    name: Validar construcción, arranque y proxy en Docker
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: gym-ci-${{ github.run_id }}-${{ github.run_attempt }}
      DOCKER_CONTAINER_PREFIX: gym-ci-${{ github.run_id }}-${{ github.run_attempt }}
      DOCKER_CHECK_DATABASE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Preparar configuración Docker sin credenciales de producción
        run: |
          export BACKEND_ENV_FILE="$RUNNER_TEMP/gym-ci-backend.env"
          echo "BACKEND_ENV_FILE=$BACKEND_ENV_FILE" >> "$GITHUB_ENV"
          printf '%s\n' 'AUTH_SECRET_KEY=ci-only-test-key-not-for-production-0123456789abcdef' > "$BACKEND_ENV_FILE"
      - name: Construir imágenes de frontend y backend
        run: docker compose -f docker-compose.yml build
      - name: Arrancar y esperar ambos contenedores
        run: docker compose -f docker-compose.yml up --detach --wait --wait-timeout 120
      - name: Comprobar backend, frontend y proxy de Nginx
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request

          def request(url):
              try:
                  response = urllib.request.urlopen(url, timeout=10)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  return response.code, response.read()

          status, body = request('http://127.0.0.1:8000/')
          assert status == 200 and json.loads(body)['status'] == 'ok'
          status, body = request('http://127.0.0.1:5173/')
          assert status == 200 and b'<html' in body.lower()
          # Sin credenciales, /api/health debe devolver el 503 del backend.
          # Comparar la respuesta directa y por Nginx verifica el proxy.
          direct = request('http://127.0.0.1:8000/api/health')
          proxied = request('http://127.0.0.1:5173/api/health')
          assert direct[0] == 503 and 'detail' in json.loads(direct[1])
          assert proxied == direct, (proxied, direct)
          print('Backend, frontend y proxy verificados sin credenciales de producción.')
          PY
      - name: Mostrar logs si falla la validación
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color
      - name: Limpiar contenedores
        if: always()
        run: docker compose -f docker-compose.yml down --volumes --remove-orphans

  schedule-emails-ci:
    needs: [docker-ci]
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validar función de recordatorios
        run: deno check supabase/functions/schedule-emails/index.ts
      - name: Pruebas de correo sin red ni credenciales
        run: |
          mkdir -p "$RUNNER_TEMP/gym-reports"
          deno test --junit-path="$RUNNER_TEMP/gym-reports/schedule-emails.xml" supabase/tests/
      - name: Conservar resultados de recordatorios
        if: always()
        uses: ./.github/actions/upload-junit
        with:
          component: schedule-emails
          report: ${{ runner.temp }}/gym-reports/schedule-emails.xml

  backend-ci:
    needs: [docker-ci]
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Detectar errores de Python, ejecutar pruebas y conservar JUnit
        uses: ./.github/actions/test-with-report
        with:
          component: backend

  frontend-ci:
    needs: [docker-ci]
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Ejecutar pruebas del frontend y conservar JUnit
        uses: ./.github/actions/test-with-report
        with:
          component: frontend

  deploy-vercel:
    needs: [documentation, backend-ci, frontend-ci, schedule-emails-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Validar configuración de Vercel
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta $name en GitHub Settings > Secrets and variables > Actions. Es una credencial de despliegue; las variables de la aplicación permanecen en Vercel."
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest
      # Desde la raíz del repositorio; el proyecto Vercel usa Root Directory=frontend.
      # pull recupera las variables VITE_ de Production antes de compilar.
      - name: Cargar configuración y variables de producción
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Compilar frontend una sola vez
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Desplegar el resultado sin recompilar
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-render:
    needs: [documentation, backend-ci, frontend-ci, schedule-emails-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      DEPLOY_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Validar configuración de Render
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Falta RENDER_DEPLOY_HOOK_URL en GitHub Settings > Secrets and variables > Actions. Copia el Deploy Hook del servicio; las variables de la aplicación permanecen en Render."
            exit 1
          fi
      # Una sola petición, sin reintentos que puedan crear otro deploy.
      # ref fija el commit probado aunque main avance durante las pruebas.
      - name: Solicitar un despliegue del commit probado
        run: |
          curl --fail --silent --show-error --max-time 30 \
            --request POST --get --data-urlencode "ref=$DEPLOY_SHA" \
            --output /dev/null "$RENDER_DEPLOY_HOOK_URL"
          echo "Render aceptó la solicitud. El resultado del despliegue se consulta en Render."

  testiny:
    needs: [documentation, docker-ci, backend-ci, frontend-ci, schedule-emails-ci]
    name: Importar JUnit por módulo y tipo
    if: >-
      always() && !cancelled() && vars.TESTINY_ENABLED == 'true' &&
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' &&
      contains(needs.*.result, 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Publicar los informes de la misma revisión fusionada que ejecutó las pruebas.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/scripts/testiny/package-lock.json
      - name: Instalar importador con versión y lockfile fijos
        working-directory: .github/scripts/testiny
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Descargar únicamente informes del workflow de origen
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          pattern: gym-junit-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/testiny-incoming
          # Cada suite tiene XML/metadatos propios; no mezclar intentos anteriores.
          merge-multiple: true
      - name: Validar y ordenar informes sin credenciales de Testiny
        run: >-
          python .github/scripts/testiny/publish.py
          --incoming "$RUNNER_TEMP/testiny-incoming"
          --output "$RUNNER_TEMP/testiny-normalized"
          --documented
      - name: Resumir cobertura de casos documentados
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'testiny-normalized/cobertura-documentada.json'
          if path.is_file():
              data = json.loads(path.read_text(encoding='utf-8'))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
                  output.write('### Casos documentados de Testiny\n\n')
                  output.write(f"Ejecutados: **{data['ejecutados']}/{data['total_documentados']} ({data['porcentaje_ejecutado']} %)**. ")
                  output.write(f"Mínimo: {data['minimo_requerido']}; aprobados: {data['aprobados']}; fallidos: {data['fallidos']}.\n\n")
                  output.write('Consultar `cobertura-documentada.json` y `trazabilidad-documentada.csv` en el artefacto `gym-testiny-normalized`.\n')
          PY
      - name: Publicar resultados automatizados
        env:
          TESTINY_API_KEY: ${{ secrets.TESTINY_API_KEY }}
          TESTINY_PROJECT: ${{ vars.TESTINY_PROJECT || 'SILVE' }}
        run: >-
          python .github/scripts/testiny/publish.py
          --incoming "$RUNNER_TEMP/testiny-incoming"
          --output "$RUNNER_TEMP/testiny-normalized"
          --documented
          --publish
      - name: Conservar informes ordenados y resumen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gym-testiny-normalized
          path: ${{ runner.temp }}/testiny-normalized
          if-no-files-found: warn
          retention-days: 14
