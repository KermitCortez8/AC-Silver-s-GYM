name: CI/CD Pipeline GYM

# Un único evento por merge, incluidos squash y rebase. Cerrar sin fusionar
# no ejecuta los jobs. No se repiten las pruebas por push, tags o PR abiertos.
on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

# Cada PR conserva su ejecución; otro merge no cancela su despliegue.
concurrency:
  group: gym-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  docker-ci:
    name: Validar construcción y arranque de Docker
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: gym-ci-${{ github.run_id }}-${{ github.run_attempt }}
      DOCKER_CONTAINER_PREFIX: gym-ci-${{ github.run_id }}-${{ github.run_attempt }}
      BACKEND_ENV_FILE: ${{ runner.temp }}/gym-ci-backend.env
      DOCKER_CHECK_DATABASE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Preparar configuración Docker sin credenciales de producción
        run: |
          printf '%s\n' 'AUTH_SECRET_KEY=ci-only-test-key-not-for-production-0123456789abcdef' > "$BACKEND_ENV_FILE"
      - name: Construir imágenes de frontend y backend
        run: docker compose -f docker-compose.yml build
      - name: Arrancar y esperar ambos contenedores
        run: docker compose -f docker-compose.yml up --detach --wait --wait-timeout 120
      - name: Comprobar backend, frontend y proxy de Nginx
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request

          def request(url):
              try:
                  response = urllib.request.urlopen(url, timeout=10)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  return response.code, response.read()

          status, body = request('http://127.0.0.1:8000/')
          assert status == 200 and json.loads(body)['status'] == 'ok'
          status, body = request('http://127.0.0.1:5173/')
          assert status == 200 and b'<html' in body.lower()
          # Sin credenciales, /api/health debe devolver el 503 del backend.
          # Comparar la respuesta directa y por Nginx verifica el proxy.
          direct = request('http://127.0.0.1:8000/api/health')
          proxied = request('http://127.0.0.1:5173/api/health')
          assert direct[0] == 503 and 'detail' in json.loads(direct[1])
          assert proxied == direct, (proxied, direct)
          print('Backend, frontend y proxy verificados sin credenciales de producción.')
          PY
      - name: Mostrar logs si falla la validación
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color
      - name: Limpiar contenedores
        if: always()
        run: docker compose -f docker-compose.yml down --volumes --remove-orphans

  schedule-emails-ci:
    needs: [docker-ci]
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validar función de recordatorios
        run: deno check supabase/functions/schedule-emails/index.ts
      - name: Pruebas de correo sin red ni credenciales
        run: deno test supabase/tests/

  backend-ci:
    needs: [docker-ci]
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt flake8 pytest
      - name: Detectar errores de Python
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Pruebas del backend
        env:
          AUTH_SECRET_KEY: ci-only-test-key-not-for-production-0123456789abcdef
        run: python -m pytest tests/ -q

  frontend-ci:
    needs: [docker-ci]
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Pruebas del frontend
        run: npm test

  deploy-vercel:
    needs: [backend-ci, frontend-ci, schedule-emails-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Validar configuración de Vercel
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta $name en GitHub Settings > Secrets and variables > Actions. Es una credencial de despliegue; las variables de la aplicación permanecen en Vercel."
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest
      # Desde la raíz del repositorio; el proyecto Vercel usa Root Directory=frontend.
      # pull recupera las variables VITE_ de Production antes de compilar.
      - name: Cargar configuración y variables de producción
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Compilar frontend una sola vez
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Desplegar el resultado sin recompilar
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-render:
    needs: [backend-ci, frontend-ci, schedule-emails-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      DEPLOY_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Validar configuración de Render
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Falta RENDER_DEPLOY_HOOK_URL en GitHub Settings > Secrets and variables > Actions. Copia el Deploy Hook del servicio; las variables de la aplicación permanecen en Render."
            exit 1
          fi
      # Una sola petición, sin reintentos que puedan crear otro deploy.
      # ref fija el commit probado aunque main avance durante las pruebas.
      - name: Solicitar un despliegue del commit probado
        run: |
          curl --fail --silent --show-error --max-time 30 \
            --request POST --get --data-urlencode "ref=$DEPLOY_SHA" \
            --output /dev/null "$RENDER_DEPLOY_HOOK_URL"
          echo "Render aceptó la solicitud. El resultado del despliegue se consulta en Render."
