# GitHub Actions solicita el despliegue del commit fusionado a main tras las pruebas.
# Mantener el autodespliegue de Render apagado para no duplicarlo.
services:
  - type: web
    name: ac-silvers-gym-api-review
    runtime: python
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: STRIPE_MODE
        value: test
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: onboarding@resend.dev
      - key: EMAIL_FROM_NAME
        value: Silver Gym Surco
